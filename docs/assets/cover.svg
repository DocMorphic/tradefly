<text x="50" y="195" fill="#f1efff" font-family="Georgia,serif" font-style="italic" font-size="132" letter-spacing="-7">tradefly</text>
<text x="58" y="246" fill="#e2dff9" font-family="Arial,sans-serif" font-size="24">A fly brain meets the stock market.</text>
<text x="58" y="281" fill="#aba6c9" font-family="Arial,sans-serif" font-size="17">Two simulations. One paper account. Every decision traceable.</text>
