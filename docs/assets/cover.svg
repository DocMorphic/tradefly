<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Tradefly — two simulated fly brains, one paper account</title>
<desc id="desc">An indigo cover with the Tradefly fly emblem and an illustrative network. 138,639 simulated neurons per fly, two independent brains, paper trading only.</desc>
