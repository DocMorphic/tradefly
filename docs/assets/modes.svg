<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Three ways to run Tradefly</title><desc id="desc">Original mode uses fixed neural thresholds. Training-only mode updates memory without submitting orders. Learned mode uses a frozen evaluated memory and requires owner selection. All modes start paused.</desc><rect width="1200" height="340" rx="20" fill="#eeecf7"/>
<g font-family="Arial,sans-serif"><rect x="20" y="20" width="372" height="300" rx="14" fill="#fff" stroke="#d9d4e9"/><text x="44" y="54" fill="#57508d" font-size="12" letter-spacing="2">MODE 01</text><text x="44" y="89" fill="#242039" font-size="25" font-weight="bold">Original fly</text><path d="M54 130V219" stroke="#57508d" stroke-width="2"/>
<circle cx="54" cy="130" r="5" fill="#57508d"/><circle cx="54" cy="174" r="5" fill="#57508d"/><circle cx="54" cy="218" r="5" fill="#57508d"/>
<text x="73" y="136" fill="#555067" font-size="17">Measured output rates</text><text x="73" y="180" fill="#555067" font-size="17">Fixed thresholds</text><text x="73" y="224" fill="#57508d" font-size="17" font-weight="bold">Paper-order intent</text><text x="44" y="271" fill="#49445e" font-size="14">The baseline experiment.</text><text x="44" y="295" fill="#777184" font-size="12">Weights and action thresholds stay fixed.</text></g>
<g font-family="Arial,sans-serif"><rect x="414" y="20" width="372" height="300" rx="14" fill="#fff" stroke="#d9d4e9"/><text x="438" y="54" fill="#3a745e" font-size="12" letter-spacing="2">MODE 02</text><text x="438" y="89" fill="#242039" font-size="25" font-weight="bold">Train without orders</text><path d="M448 130V219" stroke="#3a745e" stroke-width="2"/>
<circle cx="448" cy="130" r="5" fill="#3a745e"/><circle cx="448" cy="174" r="5" fill="#3a745e"/><circle cx="448" cy="218" r="5" fill="#3a745e"/>
<text x="467" y="136" fill="#555067" font-size="17">Measured neural patterns</text><text x="467" y="180" fill="#555067" font-size="17">Adaptive memory</text><text x="467" y="224" fill="#3a745e" font-size="17" font-weight="bold">No broker orders</text><text x="438" y="271" fill="#49445e" font-size="14">Gather experience, then measure it.</text><text x="438" y="295" fill="#777184" font-size="12">Delayed market outcomes update memory.</text></g>
<g font-family="Arial,sans-serif"><rect x="808" y="20" width="372" height="300" rx="14" fill="#fff" stroke="#d9d4e9"/><text x="832" y="54" fill="#57508d" font-size="12" letter-spacing="2">MODE 03</text><text x="832" y="89" fill="#242039" font-size="25" font-weight="bold">Tested decoder</text><path d="M842 130V219" stroke="#57508d" stroke-width="2"/>
<circle cx="842" cy="130" r="5" fill="#57508d"/><circle cx="842" cy="174" r="5" fill="#57508d"/><circle cx="842" cy="218" r="5" fill="#57508d"/>
<text x="861" y="136" fill="#555067" font-size="17">Measured neural patterns</text><text x="861" y="180" fill="#555067" font-size="17">Frozen tested memory</text><text x="861" y="224" fill="#57508d" font-size="17" font-weight="bold">Gated paper-order intent</text><text x="832" y="271" fill="#49445e" font-size="14">Evidence first. Owner selection next.</text><text x="832" y="295" fill="#777184" font-size="12">Evaluation must pass before activation.</text></g>
</svg>
